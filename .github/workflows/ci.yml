name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wireguard-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: wireguard-api/go.mod
          cache-dependency-path: wireguard-api/go.sum
      - run: go vet ./...
      - run: go test -race ./...

  service:
    name: Service (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: wireguard-winservice
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: wireguard-winservice/go.mod
          cache-dependency-path: wireguard-winservice/go.sum
      - run: go vet ./...
      - run: go test ./...

  client:
    name: Client (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: WG-Client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test --project WG-Client.Tests/WG-Client.Tests.csproj -c Release
      - run: dotnet build WG-Client/WG-Client.csproj -c Release -p:Platform=x64